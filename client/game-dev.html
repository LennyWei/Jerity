<!doctype html>
<!-- Person 2's stand-in harness: the game screen on an inline fake net, no server needed.
     Your car (white outline) is driven by your own tilt, same rules as server/game.js: omni
     (tilt the way you want to go) or car-style (roll steers, tip drives), per DRIVE_MODE.
     Flip rule as in design.md: near max speed with |tilt| >= FLIP_TILT for FLIP_HOLD_MS.
     Recover with RECOVER_TAPS taps (shakes count as taps while flipped).
     Hits, head-ons (stun) and kills (heal + buff) only happen when cars actually touch,
     with design.md 5.1 damage. Bots lap an oval at different speeds and rear-end each other.
     Laptop keys: Left/Right steer, Up forward, Down reverse, Space = tap, S = shake. Flags: ?fx=low|off, ?fps=1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Screen Dev</title>
<style>html, body { margin: 0; background: #0b0d12; height: 100%; }
#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#start button { font: 800 22px system-ui, sans-serif; padding: 18px 30px; border-radius: 14px; border: 0; background: #ffd23f; }</style>
</head>
<body>
<div id="start"><button>Tap to start</button></div>
<script type="module">
import { mount, requestMotionPermission } from './src/screens/game.js';
import { C2S, S2C, CAR_STATE, EVENT, BUFF, HIT_KIND } from '../shared/protocol.js';
import { ARENA, CARS, DEFAULT_CAR, SCALE } from '../shared/constants.js';
import { CONFIG } from '../shared/config.js';

// --- inline fake net: same on / emit shape as net.js -------------------------
const handlers = {};
const net = {
  on(ev, fn) { (handlers[ev] ||= new Set()).add(fn); return () => handlers[ev].delete(fn); },
  emit(ev, payload) {
    if (ev !== C2S.INPUT) return;
    pendingTaps += payload.taps;          // taps are a count; accumulate until a tick uses them
    lastInput = payload;
  },
};
const send = (ev, data) => handlers[ev]?.forEach((fn) => fn(data));

const ME = 'me';
const players = [ME, 'b1', 'b2', 'b3'].map((id, i) => ({ id, name: i ? `Bot ${i}` : 'You', color: i, ready: true }));
const lobby = { code: 'DEV1', hostId: ME, state: 'playing', players };
const car = CARS[DEFAULT_CAR];

let lastInput = { tilt: 0, throttle: 0, accel: false, taps: 0 };
let pendingTaps = 0;
let cars, roundStart, greedySince;

function newRound() {
  cars = players.map((p, i) => {
    const ang = (i / players.length) * Math.PI * 2;
    return { id: p.id, x: 500 + Math.cos(ang) * 220, y: 300 + Math.sin(ang) * 220, a: ang + Math.PI,
      v: 0, vx: 0, vy: 0, hp: car.hp, s: CAR_STATE.ALIVE, taps: 0, buff: BUFF.NONE, buffUntil: 0, stunUntil: 0, sc: 0, phase: ang };
  });
  greedySince = 0;
  let n = CONFIG.COUNTDOWN_S;
  send(S2C.COUNTDOWN, { seconds: n });
  const t = setInterval(() => {
    send(S2C.COUNTDOWN, { seconds: --n });
    if (n <= 0) { clearInterval(t); roundStart = performance.now(); }
  }, 1000);
}

function damage(attacker, victim, dmg, events) {
  victim.hp -= dmg;
  attacker.sc += dmg * CONFIG.SCORE_PER_DAMAGE;
  if (victim.hp > 0) return;
  victim.hp = 0; victim.s = CAR_STATE.DEAD;
  const heal = attacker.s !== CAR_STATE.DEAD ? Math.round(car.hp * CONFIG.KILL_HEAL_FRAC) : 0;
  attacker.hp = Math.min(car.hp, attacker.hp + heal);
  attacker.buff = BUFF.BOOST; attacker.buffUntil = performance.now() + CONFIG.BUFF_MS;
  attacker.sc += CONFIG.SCORE_KILL;
  events.push({ type: EVENT.KILL, attacker: attacker.id, victim: victim.id, heal, buff: BUFF.BOOST });
}

const BOT_LAP = [0.5, 0.62, 0.74];
const OMNI = CONFIG.DRIVE_MODE === 'omni';  // rad/s around the oval
const TOUCH = 34;                   // world units between centers that counts as contact
const pairHitAt = new Map();

function collide(a, b, now, events) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= TOUCH || d === 0) return;
  const n = { x: dx / d, y: dy / d };          // from a to b
  // Push apart: the player moves; bots stay on their oval but get knocked along it.
  const overlap = TOUCH - d;
  for (const [c, s] of [[a, -1], [b, 1]]) {
    if (c.id === ME) { c.x += n.x * overlap * s; c.y += n.y * overlap * s; }
  }
  const key = a.id < b.id ? a.id + b.id : b.id + a.id;
  if (now - (pairHitAt.get(key) || 0) < CONFIG.HIT_COOLDOWN_MS) return;

  const fa = { x: Math.cos(a.a), y: Math.sin(a.a) }, fb = { x: Math.cos(b.a), y: Math.sin(b.a) };
  const dot = (p, q) => p.x * q.x + p.y * q.y;
  const apA = Math.max(0, a.v * dot(fa, n)), apB = Math.max(0, -b.v * dot(fb, n));
  if (Math.max(apA, apB) < CONFIG.MIN_IMPACT_SPEED) return;
  pairHitAt.set(key, now);
  const noseA = Math.max(0, dot(fa, n)), noseB = Math.max(0, -dot(fb, n));
  const mult = (c) => (c.s === CAR_STATE.FLIPPED ? CONFIG.FLIPPED_DMG_MULT : 1);

  if (noseA >= CONFIG.HEADON_THRESHOLD && noseB >= CONFIG.HEADON_THRESHOLD) {
    const dmg = Math.round(CONFIG.DMG_K * (apA + apB) ** 2 * CONFIG.HEADON_MULT);
    events.push({ type: EVENT.HEADON, a: a.id, b: b.id, dmg, stunMs: CONFIG.CONCUSSION_MS });
    for (const c of [a, b]) {
      if (c.s === CAR_STATE.ALIVE) { c.s = CAR_STATE.STUNNED; c.stunUntil = now + CONFIG.CONCUSSION_MS; }
      if (c.id === ME) c.v = c.vx = c.vy = 0;
    }
    if (a.hp <= dmg && b.hp <= dmg) { // both wrecked: nobody gets a heal
      for (const [k, v] of [[a, b], [b, a]]) {
        v.hp = 0; v.s = CAR_STATE.DEAD; k.sc += CONFIG.SCORE_KILL;
        events.push({ type: EVENT.KILL, attacker: k.id, victim: v.id, heal: 0, buff: BUFF.NONE });
      }
      return;
    }
    damage(b, a, dmg, events);
    damage(a, b, dmg, events);
    return;
  }
  const aAttacks = apA * (0.3 + 0.7 * noseA) >= apB * (0.3 + 0.7 * noseB);
  const [atk, vic, dir, ap, nose] = aAttacks ? [a, b, n, apA, noseA] : [b, a, { x: -n.x, y: -n.y }, apB, noseB];
  const rear = Math.max(0, dot({ x: Math.cos(vic.a), y: Math.sin(vic.a) }, dir));
  const dmg = Math.round(CONFIG.DMG_K * ap * ap * (0.3 + 0.7 * nose) * (1 + CONFIG.REAR_BONUS * rear) * mult(vic));
  if (dmg < 1) return;
  events.push({ type: EVENT.HIT, attacker: atk.id, victim: vic.id, dmg, kind: rear > 0.5 ? HIT_KIND.REAR : HIT_KIND.SIDE });
  atk.hp = Math.max(1, atk.hp - Math.round(dmg * CONFIG.ATTACKER_RECOIL));
  if (atk.id === ME) { atk.v *= 0.4; atk.vx *= 0.4; atk.vy *= 0.4; }
  if (vic.id === ME) { vic.x += dir.x * 12; vic.y += dir.y * 12; } else vic.phase += 0.25; // knocked along
  damage(atk, vic, dmg, events);
}

setInterval(() => {
  if (!roundStart) return;
  const now = performance.now(), dt = 0.05, events = [];
  const me = cars[0];
  const inp = lastInput, taps = pendingTaps;
  pendingTaps = 0;
  for (const c of cars) if (c.buff && now > c.buffUntil) c.buff = BUFF.NONE;

  if (me.s === CAR_STATE.STUNNED && now > me.stunUntil) me.s = CAR_STATE.ALIVE;
  if (me.s === CAR_STATE.ALIVE && OMNI) {
    // Same omni rules as server/game.js driveOmni(): velocity swings toward the tilt direction.
    const max = car.maxSpeed * (me.buff === BUFF.BOOST ? CONFIG.BOOST_SPEED_MULT : 1);
    const wx = inp.tilt || 0, wy = -(inp.throttle || 0), want = Math.min(1, Math.hypot(wx, wy));
    if (want > 0) {
      const k = (max * want) / Math.hypot(wx, wy), dvx = wx * k - me.vx, dvy = wy * k - me.vy, dv = Math.hypot(dvx, dvy);
      const s = Math.min(1, (CONFIG.OMNI_ACCEL * dt) / (dv || 1));
      me.vx += dvx * s; me.vy += dvy * s;
    } else { const f = Math.exp(-CONFIG.COAST_DAMPING * dt); me.vx *= f; me.vy *= f; }
    me.v = Math.hypot(me.vx, me.vy);
    if (me.v > 0.8) {
      const d = Math.atan2(Math.sin(Math.atan2(me.vy, me.vx) - me.a), Math.cos(Math.atan2(me.vy, me.vx) - me.a));
      me.a += Math.max(-car.turnRate * 2, Math.min(car.turnRate * 2, d * CONFIG.OMNI_FACE_GAIN)) * dt;
    }
    const off = want > 0 && me.v > 0 ? Math.acos(Math.max(-1, Math.min(1, (wx * me.vx + wy * me.vy) / (Math.hypot(wx, wy) * me.v)))) * 57.3 : 0;
    const greedy = me.v >= car.maxSpeed * CONFIG.OMNI_FLIP_SPEED_FRAC && want >= CONFIG.FLIP_TILT && off >= CONFIG.OMNI_FLIP_ANGLE_DEG;
    greedySince = greedy ? greedySince || now : 0;
    if (greedySince && now - greedySince >= CONFIG.FLIP_HOLD_MS) {
      me.s = CAR_STATE.FLIPPED; me.v = me.vx = me.vy = 0; me.taps = 0; greedySince = 0;
      events.push({ type: EVENT.FLIP, id: ME });
    }
  } else if (me.s === CAR_STATE.ALIVE) {
    const max = car.maxSpeed * (me.buff === BUFF.BOOST ? CONFIG.BOOST_SPEED_MULT : 1);
    // Same throttle rules as the server: cruise at throttle x top speed, brake then reverse.
    const thr = inp.throttle ?? (inp.accel ? 1 : 0);
    if (thr > 0) {
      const target = max * thr;
      me.v = me.v < Math.min(CONFIG.MIN_SPEED, target) ? Math.min(CONFIG.MIN_SPEED, target)
        : me.v < target ? Math.min(target, me.v + CONFIG.ENGINE * dt) : me.v * Math.exp(-CONFIG.COAST_DAMPING * dt);
    } else if (thr < 0) {
      me.v = me.v > 0.5 ? Math.max(0, me.v - CONFIG.BRAKE * -thr * dt)
        : Math.max(-CONFIG.REVERSE_MAX_SPEED * -thr, me.v - CONFIG.REVERSE_ENGINE * dt);
    } else me.v *= Math.exp(-CONFIG.COAST_DAMPING * dt);
    me.a += inp.tilt * car.turnRate * dt * Math.max(-1, Math.min(1, me.v / CONFIG.MIN_SPEED));
    // design.md 5.3: greedy driving tips you over
    const greedy = me.v >= car.maxSpeed * CONFIG.FLIP_SPEED_FRAC && Math.abs(inp.tilt) >= CONFIG.FLIP_TILT;
    greedySince = greedy ? greedySince || now : 0;
    if (greedySince && now - greedySince >= CONFIG.FLIP_HOLD_MS) {
      me.s = CAR_STATE.FLIPPED; me.v = 0; me.taps = 0; greedySince = 0;
      events.push({ type: EVENT.FLIP, id: ME });
    }
  } else if (me.s === CAR_STATE.FLIPPED) {
    me.taps += taps;
    if (me.taps >= CONFIG.RECOVER_TAPS) { me.s = CAR_STATE.ALIVE; me.taps = 0; events.push({ type: EVENT.RECOVER, id: ME }); }
  } else { me.v *= 0.9; me.vx *= 0.9; me.vy *= 0.9; }
  if (OMNI) { me.x += me.vx * SCALE * dt; me.y += me.vy * SCALE * dt; }
  else { me.x += Math.cos(me.a) * me.v * SCALE * dt; me.y += Math.sin(me.a) * me.v * SCALE * dt; }
  if (me.x < 20 || me.x > ARENA.W - 20 || me.y < 20 || me.y > ARENA.H - 20) {
    me.x = Math.max(20, Math.min(ARENA.W - 20, me.x)); me.y = Math.max(20, Math.min(ARENA.H - 20, me.y));
    if (me.v > CONFIG.WALL_MIN_SPEED && me.s !== CAR_STATE.DEAD) {
      const dmg = Math.round(CONFIG.WALL_DMG_K * me.v * me.v);
      me.hp = Math.max(1, me.hp - dmg);
      events.push({ type: EVENT.WALL, id: ME, dmg });
    }
    me.v *= CONFIG.WALL_SPEED_KEEP; me.vx *= CONFIG.WALL_SPEED_KEEP; me.vy *= CONFIG.WALL_SPEED_KEEP;
  }

  // Bots lap an oval at different speeds, so faster ones catch and rear-end slower ones.
  cars.slice(1).forEach((c, i) => {
    if (c.s === CAR_STATE.DEAD) return;
    if (c.s === CAR_STATE.STUNNED && now > c.stunUntil) c.s = CAR_STATE.ALIVE;
    const w = BOT_LAP[i] * (c.buff === BUFF.BOOST ? CONFIG.BOOST_SPEED_MULT : 1);
    c.v = c.s === CAR_STATE.ALIVE ? (w * 205) / SCALE : 0; // m/s along the oval
    if (c.s === CAR_STATE.ALIVE) c.phase += w * dt;
    c.x = 500 + Math.cos(c.phase) * 240; c.y = 300 + Math.sin(c.phase) * 170;
    c.a = c.phase + Math.PI / 2;
  });

  // Hits happen only when cars actually touch (design.md 5.1), never at random.
  const alive = cars.filter((c) => c.s !== CAR_STATE.DEAD);
  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) collide(alive[i], alive[j], now, events);
  }

  // Debug: last hits with both cars' positions, for checking in the console (window.__hits).
  for (const e of events) {
    const [p, q] = [e.attacker ?? e.a, e.victim ?? e.b].map((id) => cars.find((c) => c.id === id));
    if (p && q) (window.__hits ||= []).push({ type: e.type, kind: e.kind, from: p.id, to: q.id, dmg: e.dmg, dist: Math.round(Math.hypot(p.x - q.x, p.y - q.y)) });
  }
  if (window.__hits?.length > 50) window.__hits.splice(0, window.__hits.length - 50);

  const timeLeft = 60 - (now - roundStart) / 1000;
  send(S2C.SNAP, { t: Date.now(), timeLeft, events,
    cars: cars.map(({ id, x, y, a, hp, s, taps, buff, sc }) => ({ id, x, y, a, hp: Math.round(hp), s, taps, buff, sc: Math.round(sc) })) });
  if (timeLeft <= 0 || alive.length <= 1) {
    roundStart = 0;
    const lb = [...cars].sort((p, q) => q.sc - p.sc);
    send(S2C.ROUND_END, { winnerId: alive[0]?.id ?? null, leaderboard: lb.map((c) => ({ id: c.id, name: c.id, kills: 0, damage: 0, score: Math.round(c.sc) })) });
    setTimeout(newRound, 2000);
  }
}, 50);

document.querySelector('#start button').onclick = async () => {
  await requestMotionPermission();
  document.getElementById('start').remove();
  mount(document.body, { net, playerId: ME, lobby, onRoundEnd: (r) => console.log('roundEnd', r) });
  newRound();
};
</script>
</body>
</html>
