<!doctype html>
<!-- Person 2's stand-in harness: the game screen on an inline fake net, no server needed.
     Your car (white outline) is driven by your own tilt / ACCEL / TAP; 3 bots circle.
     Flip rule as in design.md: near max speed with |tilt| >= FLIP_TILT for FLIP_HOLD_MS.
     Recover with RECOVER_TAPS taps (shakes count as taps while flipped).
     Random hits, head-ons (stun), and kills (heal + buff) exercise every effect.
     Laptop keys: arrows steer, Up = accel, Space = tap, S = shake. Flags: ?fx=low|off, ?fps=1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Screen Dev</title>
<style>html, body { margin: 0; background: #0b0d12; height: 100%; }
#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#start button { font: 800 22px system-ui, sans-serif; padding: 18px 30px; border-radius: 14px; border: 0; background: #ffd23f; }</style>
</head>
<body>
<div id="start"><button>Tap to start</button></div>
<script type="module">
import { mount, requestMotionPermission } from './src/screens/game.js';
import { C2S, S2C, CAR_STATE, EVENT, BUFF, HIT_KIND } from '../shared/protocol.js';
import { ARENA, CARS, DEFAULT_CAR, SCALE } from '../shared/constants.js';
import { CONFIG } from '../shared/config.js';

// --- inline fake net: same on / emit shape as net.js -------------------------
const handlers = {};
const net = {
  on(ev, fn) { (handlers[ev] ||= new Set()).add(fn); return () => handlers[ev].delete(fn); },
  emit(ev, payload) {
    if (ev !== C2S.INPUT) return;
    pendingTaps += payload.taps;          // taps are a count; accumulate until a tick uses them
    lastInput = payload;
  },
};
const send = (ev, data) => handlers[ev]?.forEach((fn) => fn(data));

const ME = 'me';
const players = [ME, 'b1', 'b2', 'b3'].map((id, i) => ({ id, name: i ? `Bot ${i}` : 'You', color: i, ready: true }));
const lobby = { code: 'DEV1', hostId: ME, state: 'playing', players };
const car = CARS[DEFAULT_CAR];

let lastInput = { tilt: 0, accel: false, taps: 0 };
let pendingTaps = 0;
let cars, roundStart, greedySince;

function newRound() {
  cars = players.map((p, i) => {
    const ang = (i / players.length) * Math.PI * 2;
    return { id: p.id, x: 500 + Math.cos(ang) * 220, y: 300 + Math.sin(ang) * 220, a: ang + Math.PI,
      v: 0, hp: car.hp, s: CAR_STATE.ALIVE, taps: 0, buff: BUFF.NONE, buffUntil: 0, stunUntil: 0, sc: 0, phase: ang };
  });
  greedySince = 0;
  let n = CONFIG.COUNTDOWN_S;
  send(S2C.COUNTDOWN, { seconds: n });
  const t = setInterval(() => {
    send(S2C.COUNTDOWN, { seconds: --n });
    if (n <= 0) { clearInterval(t); roundStart = performance.now(); }
  }, 1000);
}

function damage(attacker, victim, dmg, events) {
  victim.hp -= dmg;
  attacker.sc += dmg * CONFIG.SCORE_PER_DAMAGE;
  if (victim.hp > 0) return;
  victim.hp = 0; victim.s = CAR_STATE.DEAD;
  const heal = attacker.s !== CAR_STATE.DEAD ? Math.round(car.hp * CONFIG.KILL_HEAL_FRAC) : 0;
  attacker.hp = Math.min(car.hp, attacker.hp + heal);
  attacker.buff = BUFF.BOOST; attacker.buffUntil = performance.now() + CONFIG.BUFF_MS;
  attacker.sc += CONFIG.SCORE_KILL;
  events.push({ type: EVENT.KILL, attacker: attacker.id, victim: victim.id, heal, buff: BUFF.BOOST });
}

setInterval(() => {
  if (!roundStart) return;
  const now = performance.now(), dt = 0.05, events = [];
  const me = cars[0];
  const inp = lastInput, taps = pendingTaps;
  pendingTaps = 0;
  for (const c of cars) if (c.buff && now > c.buffUntil) c.buff = BUFF.NONE;

  if (me.s === CAR_STATE.STUNNED && now > me.stunUntil) me.s = CAR_STATE.ALIVE;
  if (me.s === CAR_STATE.ALIVE) {
    const max = car.maxSpeed * (me.buff === BUFF.BOOST ? CONFIG.BOOST_SPEED_MULT : 1);
    me.v = inp.accel ? Math.min(max, Math.max(CONFIG.MIN_SPEED, me.v + CONFIG.ENGINE * dt)) : me.v * 0.94;
    me.a += inp.tilt * car.turnRate * dt * Math.min(1, me.v / CONFIG.MIN_SPEED);
    // design.md 5.3: greedy driving tips you over
    const greedy = me.v >= car.maxSpeed * CONFIG.FLIP_SPEED_FRAC && Math.abs(inp.tilt) >= CONFIG.FLIP_TILT;
    greedySince = greedy ? greedySince || now : 0;
    if (greedySince && now - greedySince >= CONFIG.FLIP_HOLD_MS) {
      me.s = CAR_STATE.FLIPPED; me.v = 0; me.taps = 0; greedySince = 0;
      events.push({ type: EVENT.FLIP, id: ME });
    }
  } else if (me.s === CAR_STATE.FLIPPED) {
    me.taps += taps;
    if (me.taps >= CONFIG.RECOVER_TAPS) { me.s = CAR_STATE.ALIVE; me.taps = 0; events.push({ type: EVENT.RECOVER, id: ME }); }
  } else me.v *= 0.9;
  me.x += Math.cos(me.a) * me.v * SCALE * dt;
  me.y += Math.sin(me.a) * me.v * SCALE * dt;
  if (me.x < 20 || me.x > ARENA.W - 20 || me.y < 20 || me.y > ARENA.H - 20) {
    me.x = Math.max(20, Math.min(ARENA.W - 20, me.x)); me.y = Math.max(20, Math.min(ARENA.H - 20, me.y));
    if (me.v > CONFIG.WALL_MIN_SPEED && me.s !== CAR_STATE.DEAD) {
      const dmg = Math.round(CONFIG.WALL_DMG_K * me.v * me.v);
      me.hp = Math.max(1, me.hp - dmg);
      events.push({ type: EVENT.WALL, id: ME, dmg });
    }
    me.v *= CONFIG.WALL_SPEED_KEEP;
  }

  for (const c of cars.slice(1)) {
    if (c.s === CAR_STATE.DEAD) continue;
    if (c.s === CAR_STATE.STUNNED && now > c.stunUntil) c.s = CAR_STATE.ALIVE;
    if (c.s === CAR_STATE.ALIVE) c.phase += 0.6 * dt;
    c.x = 500 + Math.cos(c.phase) * 240; c.y = 300 + Math.sin(c.phase) * 170;
    c.a = c.phase + Math.PI / 2;
  }
  const alive = cars.filter((c) => c.s !== CAR_STATE.DEAD);
  const pick = () => alive[(Math.random() * alive.length) | 0];
  if (Math.random() < 0.04) {
    const v = pick(), a = pick();
    if (v && a && v !== a) {
      const kind = Math.random() < 0.3 ? HIT_KIND.REAR : HIT_KIND.SIDE;
      const dmg = Math.round((5 + Math.random() * 25) * (kind === HIT_KIND.REAR ? 1.3 : 1));
      events.push({ type: EVENT.HIT, attacker: a.id, victim: v.id, dmg, kind });
      damage(a, v, dmg, events);
    }
  } else if (Math.random() < 0.008) {
    const a = pick(), b = pick();
    if (a && b && a !== b) {
      const dmg = 8;
      for (const c of [a, b]) { c.hp = Math.max(1, c.hp - dmg); if (c.s === CAR_STATE.ALIVE) { c.s = CAR_STATE.STUNNED; c.stunUntil = now + CONFIG.CONCUSSION_MS; } }
      events.push({ type: EVENT.HEADON, a: a.id, b: b.id, dmg, stunMs: CONFIG.CONCUSSION_MS });
    }
  }

  const timeLeft = 60 - (now - roundStart) / 1000;
  send(S2C.SNAP, { t: Date.now(), timeLeft, events,
    cars: cars.map(({ id, x, y, a, hp, s, taps, buff, sc }) => ({ id, x, y, a, hp: Math.round(hp), s, taps, buff, sc: Math.round(sc) })) });
  if (timeLeft <= 0 || alive.length <= 1) {
    roundStart = 0;
    const lb = [...cars].sort((p, q) => q.sc - p.sc);
    send(S2C.ROUND_END, { winnerId: alive[0]?.id ?? null, leaderboard: lb.map((c) => ({ id: c.id, name: c.id, kills: 0, damage: 0, score: Math.round(c.sc) })) });
    setTimeout(newRound, 2000);
  }
}, 50);

document.querySelector('#start button').onclick = async () => {
  await requestMotionPermission();
  document.getElementById('start').remove();
  mount(document.body, { net, playerId: ME, lobby, onRoundEnd: (r) => console.log('roundEnd', r) });
  newRound();
};
</script>
</body>
</html>
