<!doctype html>
<!-- Person 2's stand-in harness: the game screen on an inline fake net, no server needed.
     Your car (white outline) is driven by your own tilt / ACCEL / TAP; 3 bots circle.
     Every 12 s you get flipped so you can test shake recovery. Keys on a laptop:
     arrows steer, Up = accel, Space = tap, S = shake. Flags: ?fx=low|off, ?fps=1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Screen Dev</title>
<style>html, body { margin: 0; background: #0b0d12; height: 100%; }
#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#start button { font: 800 22px system-ui, sans-serif; padding: 18px 30px; border-radius: 14px; border: 0; background: #ffd23f; }</style>
</head>
<body>
<div id="start"><button>Tap to start</button></div>
<script type="module">
import { mount, requestMotionPermission } from './src/screens/game.js';
import { C2S, S2C, CAR_STATE, EVENT } from '../shared/protocol.js';
import { ARENA, CARS } from '../shared/constants.js';
import { CONFIG } from '../shared/config.js';

// --- inline fake net: same on / emit shape as net.js -------------------------
const handlers = {};
const net = {
  on(ev, fn) { (handlers[ev] ||= new Set()).add(fn); return () => handlers[ev].delete(fn); },
  emit(ev, payload) { if (ev === C2S.INPUT) lastInput = payload; },
};
const send = (ev, data) => handlers[ev]?.forEach((fn) => fn(data));

const ME = 'me';
const players = [ME, 'b1', 'b2', 'b3'].map((id, i) =>
  ({ id, name: i ? `Bot ${i}` : 'You', team: i, car: ['balanced', 'heavy', 'light', 'balanced'][i], ready: true }));
const lobby = { code: 'DEV1', mode: 'ffa', hostId: ME, state: 'playing', players };

let lastInput = { tilt: 0, accel: false, taps: 0, shakes: 0 };
let cars, roundStart, flipAt, rec;

function newRound() {
  cars = players.map((p, i) => {
    const ang = (i / players.length) * Math.PI * 2;
    return { id: p.id, x: 500 + Math.cos(ang) * 220, y: 300 + Math.sin(ang) * 220, a: ang + Math.PI,
      v: 0, hp: CARS[p.car].hp, s: CAR_STATE.ALIVE, parry: 0, taps: 0, phase: ang };
  });
  flipAt = performance.now() + 12000;
  rec = { taps: 0, shakes: 0 };
  let n = CONFIG.COUNTDOWN_S;
  send(S2C.COUNTDOWN, { seconds: n });
  const t = setInterval(() => {
    send(S2C.COUNTDOWN, { seconds: --n });
    if (n <= 0) { clearInterval(t); roundStart = performance.now(); }
  }, 1000);
}

setInterval(() => {
  if (!roundStart) return;
  const now = performance.now(), dt = 0.05, events = [];
  const me = cars[0];
  const inp = lastInput;
  lastInput = { ...inp, taps: 0, shakes: 0, jerks: 0 };

  if (me.s === CAR_STATE.ALIVE) {
    me.v = inp.accel ? Math.min(14, Math.max(4, me.v + 6 * dt)) : me.v * 0.94;
    me.a += inp.tilt * 3.2 * dt * Math.min(1, me.v / 4) ;
    me.parry = inp.taps > 0 || inp.jerks > 0 ? 1 : 0;
    if (now > flipAt) { me.s = CAR_STATE.FLIPPED; me.v = 0; rec = { taps: 0, shakes: 0 }; events.push({ type: EVENT.FLIP, id: ME }); }
  } else if (me.s === CAR_STATE.FLIPPED) {
    rec.taps += inp.taps; rec.shakes += inp.shakes || 0;
    me.taps = rec.taps;
    if (rec.taps >= CONFIG.RECOVER_TAPS || rec.shakes >= (CONFIG.RECOVER_SHAKES ?? 12)) {
      me.s = CAR_STATE.ALIVE; me.taps = 0; flipAt = now + 12000; events.push({ type: EVENT.RECOVER, id: ME });
    }
  }
  me.x += Math.cos(me.a) * me.v * 20 * dt;
  me.y += Math.sin(me.a) * me.v * 20 * dt;
  if (me.x < 20 || me.x > ARENA.W - 20 || me.y < 20 || me.y > ARENA.H - 20) {
    me.x = Math.max(20, Math.min(ARENA.W - 20, me.x)); me.y = Math.max(20, Math.min(ARENA.H - 20, me.y));
    if (me.v > 3) events.push({ type: EVENT.WALL, id: ME, dmg: 0 });
    me.v *= 0.35;
  }

  for (const c of cars.slice(1)) {
    if (c.s === CAR_STATE.DEAD) continue;
    c.phase += 0.6 * dt;
    c.x = 500 + Math.cos(c.phase) * 240; c.y = 300 + Math.sin(c.phase) * 170;
    c.a = c.phase + Math.PI / 2;
  }
  if (Math.random() < 0.04) {
    const alive = cars.filter((c) => c.s !== CAR_STATE.DEAD);
    const v = alive[(Math.random() * alive.length) | 0], a = alive[(Math.random() * alive.length) | 0];
    if (v && a && v !== a) {
      const dmg = Math.round(5 + Math.random() * 30);
      v.hp -= dmg;
      events.push({ type: EVENT.HIT, attacker: a.id, victim: v.id, dmg });
      if (v.hp <= 0) { v.hp = 0; v.s = CAR_STATE.DEAD; events.push({ type: EVENT.KILL, attacker: a.id, victim: v.id }); }
    }
  }

  const timeLeft = 45 - (now - roundStart) / 1000;
  send(S2C.SNAP, { t: Date.now(), timeLeft, events,
    cars: cars.map(({ id, x, y, a, hp, s, parry, taps }) => ({ id, x, y, a, hp, s, parry, taps })) });
  if (timeLeft <= 0 || cars.filter((c) => c.s !== CAR_STATE.DEAD).length <= 1) {
    roundStart = 0;
    send(S2C.ROUND_END, { winnerTeam: null, leaderboard: [] });
    setTimeout(newRound, 2000);
  }
}, 50);

document.querySelector('#start button').onclick = async () => {
  await requestMotionPermission();
  document.getElementById('start').remove();
  mount(document.body, { net, playerId: ME, lobby, onRoundEnd: (r) => console.log('roundEnd', r) });
  newRound();
};
</script>
</body>
</html>
