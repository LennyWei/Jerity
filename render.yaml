# render.yaml: Render Blueprint for the game server (render.com -> New + -> Blueprint -> this repo).
# One Node web service: Express serves the built client, Socket.IO runs the game, on Render's PORT.
# Keep it at ONE instance: rooms live in the server's memory.
# Free plan sleeps after 15 min without traffic (about 1 min to wake): ping /health every 5 min
# (e.g. UptimeRobot) during the event, or switch plan to starter for always-on and more CPU.
services:
  - type: web
    name: bumper-brawl
    runtime: node
    plan: free
    region: virginia            # US East, closest to Penn State
    branch: main               # deploy the same branch as the Vercel client
    buildCommand: npm ci --include=dev && npm run build   # Vite is a dev dependency
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true            # turn off on demo day: a push restarts the server and ends rounds
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TEST_ROOM          # no always-on bot room in production: its physics would eat the free plan's CPU
        value: "off"
      # These belong on the Render server, not in public VITE_* frontend variables.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_VOICE_ID
        sync: false
